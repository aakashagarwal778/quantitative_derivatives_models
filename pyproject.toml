[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdlib"
version = "0.1.1"
description = "A structured Python library for derivatives pricing models, numerical methods, volatility models, and calibration workflows."
readme = "README.md"
authors = [{name = "Aakash Agarwal"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
